name: Mise à jour quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      payload:
        description: "Message chiffré envoyé par le site (ne pas remplir à la main)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: coffre
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la bibliothèque de chiffrement
        run: pip install --quiet cryptography
      - name: Récupérer cartes et prix (coffre chiffré)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PAYLOAD: ${{ inputs.payload }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 scripts/update_prices.py
      - name: Enregistrer les changements
        run: |
          git config user.name "catalogue-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q --ignore-unmatch data/watchlist.json data/cards.json data/history.json
          git add data/
          git diff --cached --quiet || git commit -m "Mise à jour du coffre"
          git push
