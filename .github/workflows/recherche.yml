name: Recherche quotidienne (loose -> CCC)

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coffre
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, version figée
      - name: Installer la bibliothèque de chiffrement
        run: pip install --quiet "cryptography==46.0.7"  # version figée
      - name: Reprendre l'historique des prix FR (cache, chiffré)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0, version figée
        with:
          path: cache/historique_fr.json
          key: historique-fr-${{ github.run_id }}
          restore-keys: historique-fr-
      - name: Cartes à surveiller (toutes les cartes Pokoya)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 scripts/surveiller.py
      - name: Garder l'historique des prix FR (cache, chiffré)
        if: always() && hashFiles('cache/historique_fr.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0, version figée
        with:
          path: cache/historique_fr.json
          key: historique-fr-${{ github.run_id }}
      - name: Comparer prix loose FR (Pokoya) et ventes CCC sur GCC
        if: success() || failure()
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 scripts/research.py
      - name: Enregistrer la recherche
        if: success() || failure()
        run: |
          git config user.name "catalogue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/research.json
          if [ -f data/watch.json ]; then git add data/watch.json; git rm -q --ignore-unmatch data/watch_history.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour de la recherche"
          git pull --rebase origin main
          git push
