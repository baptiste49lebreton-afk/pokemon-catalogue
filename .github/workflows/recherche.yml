name: Recherche quotidienne (loose -> CCC)

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coffre
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Installer la bibliothèque de chiffrement
        run: pip install --quiet cryptography
      - name: Comparer prix loose Cardmarket et ventes CCC sur GCC
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 scripts/research.py
      - name: Enregistrer la recherche
        run: |
          git config user.name "catalogue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/research.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour de la recherche"
          git pull --rebase origin main
          git push
